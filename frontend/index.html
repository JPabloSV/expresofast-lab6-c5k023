<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExpresoFast — Iniciar Sesión</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="pagina-login">
    <main class="login-wrapper">
        <form id="loginForm" class="login-card" novalidate>
            <h1 class="login-titulo">ExpresoFast</h1>
            <p class="login-subtitulo">Consola de Operación Logística</p>

            <div class="campo">
                <label for="username">Usuario</label>
                <input type="text" id="username" name="username" autocomplete="username" required>
            </div>

            <div class="campo">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>
            </div>

            <button type="submit" class="boton-primario">Ingresar</button>

            <p id="loginError" class="mensaje-error" role="alert" aria-live="polite"></p>
        </form>
    </main>

    <script src="app.js"></script>
</body>
</html>
